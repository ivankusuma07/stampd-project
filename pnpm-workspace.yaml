packages:
  - apps/*
  - packages/*

# Dependencies allowed to run install scripts (pnpm 11 blocks all others).
allowBuilds:
  esbuild: true
  prisma: true
  "@prisma/engines": true
  "@prisma/client": true
  sharp: true
  unrs-resolver: true
  msgpackr-extract: true
  # optional native speedups with JS fallbacks (WalletConnect deps)
  bufferutil: false
  keccak: false
  utf-8-validate: false

minimumReleaseAgeExclude:
  - viem@2.57.1
  - framer-motion@13.4.6
  - lucide-react@1.49.0
  - motion@13.4.6
  - openai@7.25.0
