[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["node_modules"]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10000
via_ir = false
fs_permissions = [{ access = "read-write", path = "../core/test/vectors" }, { access = "read-write", path = "./deployments" }]
remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "forge-std/=node_modules/forge-std/src/",
]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 64
fail_on_revert = false

# `FOUNDRY_PROFILE=ci forge test` — the 10,000-run gate from development plan step 1.6
[profile.ci.fuzz]
runs = 10000

[profile.ci.invariant]
runs = 512
depth = 128

[fmt]
line_length = 120

[lint]
exclude_lints = ["screaming-snake-case-immutable", "mixed-case-function"]
