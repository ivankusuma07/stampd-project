[project]
name = "stampd-scraper"
version = "0.1.0"
description = "X ingest service for STAMPD (twscrape + FastAPI). Single instance."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  # pinned: when X changes its internals, upgrade deliberately (plan B6b)
  "twscrape==0.20.1",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
